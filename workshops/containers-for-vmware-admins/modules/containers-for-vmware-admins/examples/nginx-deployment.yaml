# The community nginx image expects to start as root. OpenShift starts it as a
# random non-root user instead, so it fails. Module 3 uses it to show why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: docker.io/library/nginx:1.27
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
