# A PostgreSQL database that keeps its data on a PersistentVolumeClaim.
# The user name and password come from the db-credentials Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  labels:
    app: db
spec:
  # No storageClassName, so the cluster's default StorageClass provisions the volume.
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  # Stop the old pod before starting a new one, because a ReadWriteOnce
  # volume can only be attached to one node at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db
        image: quay.io/sclorg/postgresql-16-c9s:latest
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-credentials
        env:
        - name: POSTGRESQL_DATABASE
          value: inventory
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        # Ready only once PostgreSQL accepts connections, so that
        # "oc rollout status" waits for the database, not just the container.
        readinessProbe:
          exec:
            command:
            - /usr/libexec/check-container
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
