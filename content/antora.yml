# The site's home part. Every workshop under workshops/ belongs to this same component
# (name ROOT, no version), so one navigation spans all of them. The playbooks list this
# folder last, which makes this file's title, nav and attributes the ones the site uses;
# a workshop's own antora.yml only applies when it is built alone.
name: ROOT
title: "OpenShift 101 Workshop"
version: ~
nav:
  - modules/ROOT/nav.adoc

asciidoc:
  attributes:
    lab_name: "OpenShift 101 Workshop"
    # The Shared CLI tools page: the repo name names the chart and the tools Deployment,
    # extra-cli-tools lists what tools/install.sh adds (each in backticks, then ", "),
    # and the image is a fallback for local builds; the Pages and Release workflows
    # pass the published image's name and tag.
    workshop-name: "openshift-101-workshop"
    extra-cli-tools: ""
    tools-image-basename: ghcr.io/redhat-na-ssa/openshift-101-workshop-tools
    tools-image-tag: latest
    # The deployment steps on the instructor guide: the site image and the chart version,
    # with fallbacks for builds that aren't from a release.
    site-image-basename: ghcr.io/redhat-na-ssa/openshift-101-workshop
    chart-version: "X.Y.Z"
    page-pagination: true
    # tabs with the same names (such as AWS and Azure) switch together on a page
    tabs-sync-option: ''
    # Set only here, so a workshop built alone leaves out its links to the other workshops
    # (ifdef::full-site[] ... endif::[]).
    full-site: ''
    # The raw files that the Containers and Kubernetes for VMware Admins pages apply
    vmware-admins-examples: https://raw.githubusercontent.com/redhat-na-ssa/openshift-101-workshop/main/workshops/containers-for-vmware-admins/modules/containers-for-vmware-admins/examples
    page-links:
    - url: https://github.com/redhat-na-ssa/retail-store-sample-app
      text: Application Source Repository
    - url: https://github.com/rhobs/prometheus-example-app
      text: Prometheus Example Source Repository
