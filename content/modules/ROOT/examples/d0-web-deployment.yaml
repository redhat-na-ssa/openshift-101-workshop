# Three copies of a small web server that replies with the name of the pod that answered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  # The Deployment manages every pod that carries this label...
  selector:
    matchLabels:
      app: web
  # ...and stamps that label onto each pod it creates from this template.
  template:
    metadata:
      labels:
        app: web
    spec:
      # These settings match what OpenShift enforces anyway (Module 3 explains them);
      # writing them out keeps OpenShift from printing security warnings.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.56
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
